spring.application.name=api-gateway
server.port=8090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Must be EXACTLY the same text as jwt.secret in auth-service
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-to-a-long-random-text-123456}

spring.cloud.gateway.server.webflux.routes[0].id=patient-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://patient-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/patients/**

spring.cloud.gateway.server.webflux.routes[1].id=hospital-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://hospital-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/hospitals/**

spring.cloud.gateway.server.webflux.routes[2].id=doctor-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://doctor-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/doctors/**

spring.cloud.gateway.server.webflux.routes[3].id=appointment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://appointment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/appointments/**,/api/reception/**

spring.cloud.gateway.server.webflux.routes[4].id=auth-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/auth/**